<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Log — Yinqi Huang</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <a href="../index.html" class="back-link">← back to portfolio</a>

  <header class="site-head">
    <p class="kicker">Tangible Electronics for Teaching &amp; Learning — Fall 2026</p>
    <h1>Process Log</h1>
    <p class="tagline">Process documentation for TETL. Updated weekly.</p>
  </header>

  <div class="timeline" id="timeline"></div>
  <div class="empty-state" id="empty-state" hidden>No entries yet.</div>

  <footer class="site-foot">
    Yinqi Huang · updated as the semester goes
  </footer>

</div>

<script src="entries.js"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderBody(text) {
  return text
    .split(/\n\s*\n/)
    .map(p => `<p>${escapeHtml(p.trim())}</p>`)
    .join('');
}

function renderMediaItem(m) {
  const cap = m.caption ? `<figcaption>${escapeHtml(m.caption)}</figcaption>` : '';
  if (m.type === 'image') {
    return `<figure><img src="${m.src}" alt="${escapeHtml(m.caption || '')}" loading="lazy">${cap}</figure>`;
  }
  if (m.type === 'video') {
    return `<figure><video src="${m.src}" controls preload="metadata"></video>${cap}</figure>`;
  }
  if (m.type === 'youtube') {
    return `<figure><iframe src="https://www.youtube.com/embed/${encodeURIComponent(m.src)}" allowfullscreen></iframe>${cap}</figure>`;
  }
  return '';
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  const timeline = document.getElementById('timeline');
  const emptyState = document.getElementById('empty-state');
  const list = (window.entries || []).slice().sort((a, b) => b.date.localeCompare(a.date));

  if (list.length === 0) {
    emptyState.hidden = false;
    return;
  }

  timeline.innerHTML = list.map(e => `
    <div class="entry">
      <div class="date">${formatDate(e.date)}<span class="dot"></span></div>
      <div class="card">
        <h2>${escapeHtml(e.title || '')}</h2>
        ${(e.tags && e.tags.length) ? `<div class="tags">${e.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="body">${renderBody(e.body || '')}</div>
        ${(e.media && e.media.length) ? `<div class="media">${e.media.map(renderMediaItem).join('')}</div>` : ''}
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
